
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format api_json escape=json
        '{"time":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"ua":"$http_user_agent",'
        '"appid":"$http_x_app_id"}';

    server {
        listen 127.0.0.1:8080;

        access_log logs/api_access.log api_json;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header X-App-Id $http_x_app_id;
        }
    }
}